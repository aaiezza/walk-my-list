version: '3'
services:
  web:
    build: .
    ports:
      - 8080:8080
    volumes:
      - "${HOME}/.aws/credentials:/home/docker/.aws/credentials"

  verify:
    image: maven:3-amazoncorretto-11
    volumes:
      - ${HOME}/.m2/repository:/home/docker/.m2/repository:cached
      - ${HOME}/.aws:/home/docker/.aws:ro
      - ${PWD}:/app/code:cached
    working_dir: /app/code
    command: ["mvn", "clean", "verify", "spring-boot:repackage"]
